info:
  name: Logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/{{prefix_api_v1}}/account/logout"
  body:
    type: json
    data: |-
      {
        "refresh_token":"{{refresh_token}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
