info:
  name: create-object
  type: http
  seq: 6

http:
  method: PUT
  url: "{{base_url}}/{{prefix_api_v1}}/accounts/:account_id/buckets/project1/objects/avatar/path/to/file.txt"
  params:
    - name: account_id
      value: "{{account_id}}"
      type: path
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /path/to/file.txt
        contentType: image/jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
